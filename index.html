<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora Pediátrica</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f5f7;
  padding:20px;
  max-width:500px;
  margin:auto
}
.box{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 2px 10px #ccc
}
h1{
  color:#1769aa;
  text-align:center
}
label{
  display:block;
  font-weight:bold;
  margin-top:18px
}
input,select,button{
  width:100%;
  padding:14px;
  margin-top:6px;
  font-size:17px;
  border-radius:9px;
  border:1px solid #ccc;
  box-sizing:border-box
}
button{
  background:#1769aa;
  color:white;
  border:0;
  font-weight:bold;
  margin-top:25px
}
#resultado{
  margin-top:20px;
  padding:15px;
  background:#eaf5ff;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h1>Calculadora Pediátrica</h1>

<label>Peso (kg)</label>
<input id="peso" type="number" step="0.1" placeholder="Ex.: 20">

<label>Princípio ativo</label>
<select id="medicamento">
<option value="">Selecionar</option>
<option>Paracetamol</option>
<option>Ibuprofeno</option>
<option>Amoxicilina</option>
<option>Amoxicilina + ácido clavulânico</option>
<option>Azitromicina</option>
</select>

<label>Indicação</label>
<select id="indicacao">
<option>Selecionar</option>
<option>Febre / dor</option>
<option>Otite média aguda</option>
<option>Sinusite</option>
<option>Pneumonia</option>
<option>Faringite / amigdalite</option>
</select>

<button onclick="calcular()">CALCULAR</button>

<div id="resultado"></div>

</div>

<script>
function calcular(){

let peso=document.getElementById("peso").value;
let medicamento=document.getElementById("medicamento").value;
let indicacao=document.getElementById("indicacao").value;

if(!peso || !medicamento){
document.getElementById("resultado").innerHTML=
"⚠️ Introduza o peso e selecione o medicamento.";
return;
}

document.getElementById("resultado").innerHTML=
"<b>Medicamento:</b> "+medicamento+
"<br><b>Peso:</b> "+peso+" kg"+
"<br><b>Indicação:</b> "+indicacao+
"<br><br>⚠️ Dose ainda por validar através do RCM do INFARMED.";

}
</script>

</body>
</html>
